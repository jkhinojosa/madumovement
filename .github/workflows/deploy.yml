# ═══════════════════════════════════════════════════════════════════════════
# MADU — CI/CD Pipeline: GitHub → Hostinger (SSH / SCP)
# ═══════════════════════════════════════════════════════════════════════════
# Dispara un deploy automático a Hostinger vía SSH/SCP cada vez que se hace push a main.
# Puerto predeterminado de Hostinger SSH: 65002
#
# REQUISITOS EN HOSTINGER:
#   1. hPanel → Avanzado → Acceso SSH → Asegurarse de que esté "Habilitado".
#
# REQUISITOS EN GITHUB (Settings → Secrets and variables → Actions):
#   SSH_HOST (o FTP_SERVER)     → IP o Host de SSH de Hostinger
#   SSH_USERNAME (o FTP_USERNAME) → Usuario SSH / cPanel
#   SSH_PASSWORD (o FTP_PASSWORD) → Contraseña de SSH
#   SSH_PORT                    → (Opcional, defecto 65002)
#   SSH_TARGET (o FTP_PATH)     → (Opcional, defecto 'public_html')
# ═══════════════════════════════════════════════════════════════════════════

name: 🚀 Deploy MADU → Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite deploy manual desde la UI de GitHub

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: 📦 Deploy to Hostinger via SSH
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout del código ──────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Validar que los archivos críticos existen ────────
      - name: ✅ Validate build
        run: |
          echo "🔍 Validando archivos del sitio..."
          for file in index.html style.css main.js; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: $file no encontrado"
              exit 1
            fi
            echo "  ✅ $file ($(wc -c < $file) bytes)"
          done
          echo ""
          echo "📋 Archivos a desplegar:"
          ls -lh index.html style.css main.js *.png img/*.jpg
          echo "✅ Validación completada"

      # ── 3. Deploy vía SCP (SSH) a Hostinger ─────────────────
      - name: 🚀 Deploy via SCP (SSH)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          source: "index.html,style.css,main.js,*.png,img/*"
          target: ${{ secrets.SSH_TARGET || secrets.FTP_PATH || 'public_html' }}
          overwrite: true

      # ── 4. Notificación de éxito ────────────────────────────
      - name: ✅ Deploy exitoso
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  🎉 MADU desplegado exitosamente en Hostinger vía SSH"
          echo "  📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  🔗 Commit: ${{ github.sha }}"
          echo "═══════════════════════════════════════════════════"
